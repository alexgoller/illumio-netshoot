---
apiVersion: v1
kind: Namespace
metadata:
  name: netshoot
  labels:
    name: netshoot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    com.illumio.app: attacker
    com.illumio.role: evil
  name: netshoot
  namespace: netshoot
  labels:
    app: netshoot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netshoot
  template:
    metadata:
      labels:
        app: netshoot
    spec:
      containers:
      - name: netshoot
        image: nicolaka/netshoot:latest
        command: ["/bin/bash"]
        args: ["-c", "while true; do sleep 3600; done"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
      restartPolicy: Always
